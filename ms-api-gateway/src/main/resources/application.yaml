spring:
  application:
    name: ms-api-gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 30s
            pool:
              type: elastic
              max-idle-time: 15s
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Expose-Headers Vary X-Correlation-Id, RETAIN_FIRST
          routes:
            - id: ms-autenticacion
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/perfiles/**

            - id: ms-productos
              uri: ${PRODUCTOS_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/productos/**,/api/v1/marcas/**,/api/v1/categorias/**,/api/v1/unidades-medida/**

            - id: ms-inventario
              uri: ${INVENTARIO_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/inventarios/**,/api/v1/inventario/**,/api/v1/movimientos-inventario/**,/api/v1/ajustes-inventario/**

            - id: ms-compras
              uri: ${COMPRAS_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/compras/**,/api/v1/proveedores/**

            - id: ms-ventas
              uri: ${VENTAS_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/ventas/**,/api/v1/clientes/**

            - id: ms-servicios
              uri: ${SERVICIOS_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/servicios/**,/api/v1/servicios-taller/**,/api/v1/tipos-servicio/**

            - id: ms-alertas-notificaciones
              uri: ${ALERTAS_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/alertas/**,/api/v1/notificaciones/**

            - id: ms-reportes
              uri: ${REPORTES_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/v1/reportes/**

            - id: ms-asistente-ia
              uri: ${ASISTENTE_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/v1/conversaciones-ia/**

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

jwt:
  secret: ${JWT_SECRET:dGVzdC1zZWNyZXQta2V5LXNob3VsZC1iZS12ZXJ5LWxvbmctYW5kLXNlY3VyZS0yNTYtYml0cw==}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
